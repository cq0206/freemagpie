name: Complete FreeMagpie download branding

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing published release with tested branded Mac archives
        required: true
        default: '0.1.0'
        type: string

permissions:
  contents: write

concurrency:
  group: freemagpie-release
  cancel-in-progress: false

jobs:
  branding:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate and add distribution filenames without rebuilding code
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="freemagpie-v$VERSION"
          test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = false
          gh release download "$tag" --dir dist
          (cd dist && sha256sum --check SHA256SUMS)
          for asset in dist/magpie-*; do
            [[ "$asset" == *.zip ]] && continue
            cp "$asset" "dist/free${asset#dist/}"
          done
          python3 build/freemagpie/test_manifest.py
          python3 build/freemagpie/manifest.py "$VERSION" dist
          (cd dist && sha256sum --check SHA256SUMS)
          gh release upload "$tag" dist/freemagpie-* --clobber
          gh release upload "$tag" dist/latest.json dist/notes.json dist/SHA256SUMS --clobber
          gh release edit "$tag" --notes-file build/freemagpie/RELEASE_NOTES.md
          test "$(gh release view "$tag" --json assets --jq '.assets | length')" = 31
